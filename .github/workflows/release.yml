# Ao enviar uma tag vX.Y.Z, o GitHub compila o instalador do Windows, assina o pacote de update e
# publica o release com o latest.json. Os apps instalados encontram o release e se atualizam sozinhos.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Tests and type checks
        run: |
          npm test
          npm run typecheck
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Tag must match package.json version
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME differs from version $v"; exit 1; fi

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional: once you have a GGG OAuth app, create these in Settings → Variables.
          VITE_POE_CLIENT_ID: ${{ vars.POE_CLIENT_ID }}
          VITE_POE_CONTACT: ${{ vars.POE_CONTACT }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Exile's Companion ${{ github.ref_name }}
          releaseBody: Download the `_x64-setup.exe` file below and run it. Installed copies update themselves.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
