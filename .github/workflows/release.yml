# Ao enviar uma tag vX.Y.Z, o GitHub compila o instalador do Windows e publica um release.
# O app instalado nos computadores dos seus amigos encontra esse release e se atualiza sozinho.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Node 22 fixo: com versões mais novas o upload do electron-builder encerrava antes de terminar.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testes e tipos
        run: |
          npm test
          npm run typecheck

      - name: Confere se a tag bate com a versão do package.json
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME diferente da versão $v"; exit 1; fi

      - name: Compila o instalador
        run: |
          npx electron-vite build
          npx electron-builder --win --publish never
        env:
          # Opcional: quando tiver um app OAuth da GGG, crie estas variáveis em Settings → Variables.
          MAIN_VITE_POE_CLIENT_ID: ${{ vars.POE_CLIENT_ID }}
          MAIN_VITE_POE_CONTACT: ${{ vars.POE_CONTACT }}

      # O auto-update precisa dos três arquivos: instalador, blockmap e latest.yml (com o SHA-512).
      - name: Publica no GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          FILES="dist/StashLedger-Setup-$V.exe dist/StashLedger-Setup-$V.exe.blockmap dist/latest.yml"
          for f in $FILES; do test -f "$f" || { echo "Faltando: $f"; exit 1; }; done
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $FILES --clobber
          else
            gh release create "$GITHUB_REF_NAME" $FILES --title "Stash Ledger $V" --generate-notes
          fi
