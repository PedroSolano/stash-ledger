<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Overlay de alerta (sirene). Janela transparente, sem bordas e sem foco, criada pelo Rust. -->
    <title>Stash Ledger alert</title>
  </head>
  <body>
    <div id="alert" class="alert" hidden>
      <img class="siren" src="/siren.gif" width="160" height="160" alt="" />
      <div class="card">
        <div class="tag" id="tag">Valuable drop</div>
        <div class="item">
          <img class="icon" id="icon" alt="" hidden />
          <div class="name" id="name"></div>
        </div>
        <div class="detail" id="detail"></div>
        <div class="value" id="value"></div>
        <div class="more" id="more"></div>
      </div>
    </div>
    <script type="module" src="./src/overlay/main.ts"></script>
  </body>
</html>
